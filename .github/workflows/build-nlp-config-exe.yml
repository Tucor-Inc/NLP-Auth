name: Build NLP Configuration Utility EXE

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "NLP-Config-EXE-Build/**"
      - ".github/workflows/build-nlp-config-exe.yml"
  push:
    branches:
      - agent/nlp-config-exe-v25.8
    paths:
      - "NLP-Config-EXE-Build/**"
      - ".github/workflows/build-nlp-config-exe.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Reconstruct SEA source and embedded UI asset
        working-directory: NLP-Config-EXE-Build
        shell: pwsh
        run: |
          function Join-Parts([string]$Pattern, [string]$OutputPath) {
            $parts = Get-ChildItem -Path $Pattern | Sort-Object Name
            if (-not $parts) { throw "No parts found for $Pattern" }
            $joined = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
            [System.IO.File]::WriteAllBytes($OutputPath, [Convert]::FromBase64String($joined))
          }

          Join-Parts "parts/sea.*.part" "sea-main.js"
          Join-Parts "parts/html.*.part" "index.html.br.b64"

          node --check sea-main.js
          if (-not (Test-Path "index.html.br.b64")) { throw "Embedded UI asset was not reconstructed." }

      - name: Build Windows single executable
        working-directory: NLP-Config-EXE-Build
        shell: pwsh
        run: |
          node --version
          node --build-sea sea-config.json
          if (-not (Test-Path "NLP Configuration Utility.exe")) { throw "SEA build did not produce the EXE." }

      - name: Hide console window
        working-directory: NLP-Config-EXE-Build
        shell: pwsh
        run: |
          ./patch-gui-subsystem.ps1 -Path "NLP Configuration Utility.exe"

      - name: Generate checksum
        working-directory: NLP-Config-EXE-Build
        shell: pwsh
        run: |
          $hash = (Get-FileHash "NLP Configuration Utility.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  NLP Configuration Utility.exe" | Out-File -Encoding ascii SHA256.txt

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: NLP-Configuration-Utility-v25.8-Windows
          path: |
            NLP-Config-EXE-Build/NLP Configuration Utility.exe
            NLP-Config-EXE-Build/SHA256.txt
          if-no-files-found: error
